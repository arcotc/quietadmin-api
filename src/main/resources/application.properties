spring.application.name=quietadmin-api
# Active profile must be set externally — never hardcoded here.
# Local dev:  export SPRING_PROFILES_ACTIVE=local  (or set in IDE run config)
# Staging:    SPRING_PROFILES_ACTIVE=staging  (set in Docker/server env)
# Production: SPRING_PROFILES_ACTIVE=prod

# ===============================
# DATASOURCE
# ===============================

spring.datasource.url=jdbc:mysql://localhost:3306/quietadmin?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=quietadmin_user
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA
# ===============================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# FLYWAY
# ===============================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===============================
# SERVER
# ===============================

server.port=8180

security.jwt.secret=${JWT_SECRET}
# Default fallback (safe if profile misconfigured)
security.jwt.expiration-seconds=900
security.session.idle-seconds=1209600
security.refresh.expires-days=30

stripe.trialDays=14

# ===============================
# SPRINGDOC / SWAGGER
# ===============================
# Disabled by default for all environments.
# Enabled explicitly in application-local.properties only.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false