spring.application.name=quietadmin-api
spring.profiles.active=local

# ===============================
# DATASOURCE
# ===============================

spring.datasource.url=jdbc:mysql://localhost:3306/quietadmin?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=quietadmin_user
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA
# ===============================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# FLYWAY
# ===============================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===============================
# SERVER
# ===============================

server.port=8180

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-seconds=3600
security.session.idle-seconds=1209600
security.refresh.expires-days=30