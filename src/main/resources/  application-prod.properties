spring.application.name=quietadmin-api

# Default profile can be overridden by env var SPRING_PROFILES_ACTIVE
spring.profiles.active=local

server.port=8180

# JPA common
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway common
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT common (no secrets here)
security.jwt.expiration-seconds=900
security.jwt.refresh-expiration-seconds=2592000
security.jwt.clock-skew-seconds=60

security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER}
security.jwt.audience=${JWT_AUDIENCE}

security.cookie.secure=true

spring.mail.host=smtp.yourprovider.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=no-reply@quietadmin.com
app.mail.base-url=https://api.quietadmin.com