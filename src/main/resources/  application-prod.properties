spring.application.name=quietadmin-api

# Default profile can be overridden by env var SPRING_PROFILES_ACTIVE
spring.profiles.active=local

server.port=8180

# JPA common
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway common
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT common (no secrets here)
# Access token lifetime (short for security)
security.jwt.access-expiration-seconds=600
security.jwt.refresh-expiration-seconds=28800
security.session.idle-seconds=7200
security.jwt.clock-skew-seconds=5

security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER}
security.jwt.audience=${JWT_AUDIENCE}

security.cookie.secure=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=admin@quietadmin.co.uk
spring.mail.password=xxx
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=no-reply@quietadmin.com
app.mail.base-url=https://api.quietadmin.com
app.mail.ui-base-url=https://quietadmin.com
app.ui.base-url=https://quietadmin.com
app.api.base-url=https://api.quietadmin.com

app.frontendBaseUrl=https://quietadmin.co.uk
stripe.secretKey=${STRIPE_SECRET_KEY}
stripe.webhookSecret=${STRIPE_WEBHOOK_SECRET}
stripe.priceId=${STRIPE_PRICE_ID}
stripe.price.standard=${STRIPE_PRICE_ID}