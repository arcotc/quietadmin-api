# Override the local profile activation from main application.properties
spring.profiles.active=

spring.flyway.enabled=false
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT — test-only values (never used in production)
security.jwt.secret=test-secret-key-for-unit-tests-must-be-at-least-32-chars-long
security.jwt.access-expiration-seconds=600
security.jwt.issuer=quietadmin-test
security.jwt.audience=quietadmin-app
security.jwt.clock-skew-seconds=5
security.session.idle-seconds=86400
security.refresh.expires-days=30
security.jwt.refresh-expiration-seconds=86400

# Stripe — placeholders (real calls never made in tests)
stripe.secretKey=sk_test_placeholder
stripe.webhookSecret=whsec_placeholder
stripe.priceId=price_placeholder
stripe.trialDays=14

# Mail — disabled in tests
spring.mail.host=localhost
spring.mail.port=25
app.mail.from=noreply@test.local
app.mail.base-url=http://localhost
app.mail.ui-base-url=http://localhost
app.ui.base-url=http://localhost
app.api.base-url=http://localhost

security.cookie.secure=false